[project]
name = "tg-netdisk-backend"
version = "0.1.5"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.38.0",
  "sqlalchemy==2.0.44",
  "alembic==1.17.0",
  "telethon==1.45.0",
  "httpx[socks]==0.28.1",
  "pillow==13.0.0",
  "qrcode==8.2",
  "keyring==25.6.0",
  "python-socks[asyncio]==2.7.2",
  "cryptg==0.6.0",
  "cryptography==50.0.2",
]
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.14.1",
    "mypy==1.18.2",
    "pyinstaller==6.16.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tg_netdisk"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
