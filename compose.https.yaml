services:
  app:
    environment:
      TG_PUBLIC_ORIGIN: https://${TG_DOMAIN:?Set TG_DOMAIN to your public hostname}
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TG_DOMAIN: ${TG_DOMAIN:?Set TG_DOMAIN to your public hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
