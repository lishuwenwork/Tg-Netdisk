services:
  app:
    build: .
    image: tg-netdisk:web
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "127.0.0.1:${TG_HTTP_PORT:-8080}:8080"
    environment:
      TG_MODE: web
      TG_PUBLIC_ORIGIN: ${TG_PUBLIC_ORIGIN:-http://localhost:8080}
      TG_WEB_PASSWORD_FILE: /run/secrets/web_password
      TG_SECRET_KEY_FILE: /run/secrets/credential_key
    volumes:
      - ./deploy/data:/data
      - ${TG_MEDIA_DIR:?Set TG_MEDIA_DIR to the server media directory}:/media:ro
    secrets:
      - web_password
      - credential_key
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
secrets:
  web_password:
    file: ./deploy/.secrets/web_password
  credential_key:
    file: ./deploy/.secrets/credential_key
